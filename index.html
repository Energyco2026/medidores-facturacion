<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Medidores y Facturación</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
:root{--bg:#f4f6f9;--card:#fff;--ink:#16202c;--muted:#64748b;--line:#e3e8ef;--azul:#1f5fbf;--rojo:#c62828;--rojo-bg:#fdecea;--nar:#b45309;--nar-bg:#fff4e0;--ama:#8a6d00;--ama-bg:#fff8d6;--verde:#1b7f3b;--verde-bg:#e7f6ec;--gris-bg:#eef1f5}
*{box-sizing:border-box}body{margin:0;font-family:"Segoe UI",system-ui,-apple-system,Arial,sans-serif;background:var(--bg);color:var(--ink);font-size:14px}
.hidden{display:none!important}
header{background:#0f2340;color:#fff;padding:14px 22px;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
header img{height:34px;background:#fff;border-radius:6px;padding:3px 6px}
header h1{font-size:18px;margin:0;font-weight:600}header small{opacity:.75;display:block;font-size:12px}
header .der{margin-left:auto;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
button{font:inherit;cursor:pointer;border-radius:8px;border:1px solid var(--line);background:#fff;padding:7px 12px}
button.prim{background:var(--azul);color:#fff;border-color:var(--azul)}button:disabled{opacity:.6;cursor:wait}
header button{background:rgba(255,255,255,.12);color:#fff;border-color:rgba(255,255,255,.3)}
main{padding:18px 22px;max-width:1500px;margin:0 auto}
.login{max-width:360px;margin:70px auto;background:var(--card);padding:26px;border-radius:14px;box-shadow:0 4px 20px rgba(15,35,64,.08)}
.login h2{margin:0 0 4px}.login p{color:var(--muted);margin:0 0 16px}
.login input{width:100%;padding:10px;border:1px solid var(--line);border-radius:8px;margin-bottom:10px;font:inherit}
.login button{width:100%;padding:10px}.err{color:var(--rojo);min-height:18px;font-size:13px}
.aviso{border-radius:12px;padding:14px 16px;margin-bottom:14px;display:flex;gap:12px;align-items:center;font-size:15px}
.aviso.rojo{background:var(--rojo-bg);border:1px solid #f3b7b2;color:#7f1d1d}.aviso.ok{background:var(--verde-bg);border:1px solid #b7e2c4;color:#14532d}
.aviso b{font-size:16px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px;margin-bottom:14px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;cursor:pointer;border-left:5px solid var(--line);transition:box-shadow .15s}
.kpi:hover{box-shadow:0 3px 12px rgba(15,35,64,.08)}.kpi.sel{outline:2px solid var(--azul)}
.kpi .t{font-size:12px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.03em}
.kpi .n{font-size:24px;font-weight:700;margin-top:2px}.kpi .m{font-size:13px;color:var(--muted)}
.kpi.rojo{border-left-color:var(--rojo)}.kpi.rojo .n{color:var(--rojo)}.kpi.nar{border-left-color:#f59e0b}.kpi.ama{border-left-color:#eab308}.kpi.verde{border-left-color:var(--verde)}.kpi.gris{border-left-color:#94a3b8}
.filtros{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px;align-items:center}
.filtros input,.filtros select{padding:8px 10px;border:1px solid var(--line);border-radius:8px;font:inherit;background:#fff}
.filtros input{flex:1;min-width:220px}
.nota{color:var(--muted);font-size:12.5px;margin:6px 0 12px}
.tabla{background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:auto;max-height:68vh}
table{border-collapse:collapse;width:100%;min-width:1100px}
th{position:sticky;top:0;background:#f8fafc;text-align:left;font-size:12px;color:#475569;font-weight:600;padding:9px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:9px 10px;border-bottom:1px solid #eef1f5;vertical-align:top}
tr.fila{cursor:pointer}tr.fila:hover td{background:#f8fbff}
td.num{text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
.badge{display:inline-block;padding:3px 9px;border-radius:999px;font-size:12px;font-weight:600;white-space:nowrap}
.b-rojo{background:var(--rojo-bg);color:var(--rojo)}.b-nar{background:var(--nar-bg);color:var(--nar)}.b-ama{background:var(--ama-bg);color:var(--ama)}.b-verde{background:var(--verde-bg);color:var(--verde)}.b-gris{background:var(--gris-bg);color:#475569}
.nuevo{background:var(--rojo);color:#fff;font-size:10.5px;padding:2px 6px;border-radius:5px;margin-left:6px;font-weight:700}
.barra{height:6px;background:#e5e9f0;border-radius:4px;overflow:hidden;margin-top:4px;min-width:80px}.barra i{display:block;height:100%;background:var(--verde)}
.det td{background:#fbfcfe}.det .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:16px;padding:4px 2px}
.det h4{margin:0 0 6px;font-size:13px}.det table{min-width:0}.det th,.det td{padding:5px 8px;font-size:12.5px}
.det dl{display:grid;grid-template-columns:150px 1fr;gap:4px 10px;margin:0;font-size:12.5px}.det dt{color:var(--muted)}.det dd{margin:0}
.sub{color:var(--muted);font-size:12px}
.pie{color:var(--muted);font-size:12px;margin-top:10px}
a{color:var(--azul)}
.cargando{padding:40px;text-align:center;color:var(--muted)}
@media(max-width:700px){main{padding:12px}header{padding:12px}}
</style>
</head>
<body>
<header>
  <img src="https://energyco2026.github.io/cierre_financiero_proyectado_2026/assets/energycontrol-logo.png" alt="Energycontrol" onerror="this.style.display='none'">
  <div><h1>Medidores bidireccionales · Facturación</h1><small>Ventas ganadas del CRM vs. facturado en Odoo vs. Excel de regularización de medidores</small></div>
  <div class="der hidden" id="barraUsuario">
    <span id="usuario" style="font-size:12px;opacity:.85"></span>
    <button id="btnActualizar" onclick="cargar()">↻ Actualizar</button>
    <button onclick="descargar()">⬇ Excel</button>
    <button onclick="salir()">Cerrar sesión</button>
  </div>
</header>

<div id="vistaLogin" class="login hidden">
  <h2>Ingresar</h2>
  <p>Usa tu correo de Energycontrol.</p>
  <input id="email" type="email" placeholder="Correo" autocomplete="username">
  <input id="clave" type="password" placeholder="Contraseña" autocomplete="current-password" onkeydown="if(event.key==='Enter')ingresar()">
  <div class="err" id="loginErr"></div>
  <button class="prim" onclick="ingresar()">Ingresar</button>
</div>

<main id="vistaApp" class="hidden">
  <div id="aviso"></div>
  <div class="kpis" id="kpis"></div>
  <div class="filtros">
    <input id="buscar" placeholder="Buscar PO, cliente, oportunidad o factura…" oninput="pintar()">
    <select id="fAnio" onchange="pintar()">
      <option value="2025+">Cierres 2025 y 2026</option><option value="2026">Cierres 2026</option><option value="2025">Cierres 2025</option><option value="ALL">Todos los años</option>
    </select>
    <select id="fTipo" onchange="pintar()"></select>
    <select id="fCruce" onchange="pintar()">
      <option value="ALL">Todos los cruces</option><option value="PO">Cruce por PO</option><option value="CLI">Cruce por cliente (verificar)</option><option value="SIN">Sin trámite en el Excel</option>
    </select>
  </div>
  <div class="nota" id="nota"></div>
  <div class="tabla"><table>
    <thead><tr><th>PO</th><th>Cliente / oportunidad</th><th>Tipo</th><th>Cierre CRM</th><th class="num">Contrato sin IVA</th><th class="num">Facturado Odoo</th><th>% fact.</th><th class="num">Pendiente</th><th>Medidor (Excel)</th><th>Etapa trámite</th><th>Estado</th></tr></thead>
    <tbody id="cuerpo"><tr><td colspan="11" class="cargando">Cargando…</td></tr></tbody>
  </table></div>
  <div class="pie" id="pie"></div>
</main>

<script>
const sb = supabase.createClient("https://wiqnfnlnsdnkxgshchjg.supabase.co","sb_publishable_Rk88NYc5jpdJiTQgUKViZA_0VvpbRpE");
const ESTADOS = {
  FACTURAR_YA:      {grupo:"YA",    txt:"🔴 Facturar ya el 10%", cls:"b-rojo"},
  REVISAR_MEDIDOR:  {grupo:"REV",   txt:"Medidor instalado · Odoo no muestra lo facturado", cls:"b-nar"},
  SOBREFACTURADO:   {grupo:"REV",   txt:"Facturado mayor al contrato", cls:"b-nar"},
  PENDIENTE_MAS_10: {grupo:"REV",   txt:"Falta más del 10%", cls:"b-nar"},
  SIN_FACTURAR:     {grupo:"REV",   txt:"Sin facturas en Odoo", cls:"b-nar"},
  ESPERA_MEDIDOR:   {grupo:"ESP",   txt:"⏳ Espera medidor (10%)", cls:"b-ama"},
  ESPERA_SIN_TRAMITE:{grupo:"ESP",  txt:"⏳ Falta 10% · sin trámite en el Excel", cls:"b-ama"},
  FACTURADO_100:    {grupo:"OK",    txt:"✅ Facturado 100%", cls:"b-verde"},
  SIN_PO:           {grupo:"SD",    txt:"Sin PO en Odoo", cls:"b-gris"},
  SIN_CONTRATO:     {grupo:"SD",    txt:"Sin contrato en Odoo", cls:"b-gris"},
};
const GRUPOS = [
  {id:"YA",  t:"Facturar ya", cls:"rojo", d:"Medidor instalado y falta el 10%"},
  {id:"REV", t:"Revisar", cls:"nar", d:"Diferencias que no cuadran"},
  {id:"ESP", t:"Esperando medidor", cls:"ama", d:"90% facturado, medidor pendiente"},
  {id:"OK",  t:"Facturado 100%", cls:"verde", d:"Contrato facturado completo"},
  {id:"SD",  t:"Sin datos para validar", cls:"gris", d:"Sin PO o sin contrato en Odoo"},
];
let DATA=null, GRUPO="YA", ABIERTOS=new Set();
const $=id=>document.getElementById(id);
const esc=v=>String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const money=n=>(Number(n)||0).toLocaleString("es-EC",{style:"currency",currency:"USD",minimumFractionDigits:2});
const fecha=s=>{if(!s)return "—";const d=String(s).slice(0,10).split("-");return d.length===3?d[2]+"/"+d[1]+"/"+d[0]:s;};
const hace=s=>{if(!s)return "";const m=Math.round((Date.now()-new Date(s))/60000);return m<60?"hace "+m+" min":m<1440?"hace "+Math.round(m/60)+" h":"hace "+Math.round(m/1440)+" días";};

async function iniciar(){
  const {data:{session}}=await sb.auth.getSession();
  if(session){mostrarApp(session.user.email);cargar();}else{$("vistaLogin").classList.remove("hidden");}
}
async function ingresar(){
  $("loginErr").textContent="";
  const {data,error}=await sb.auth.signInWithPassword({email:$("email").value.trim(),password:$("clave").value});
  if(error){$("loginErr").textContent="No se pudo ingresar: "+error.message;return;}
  $("vistaLogin").classList.add("hidden");mostrarApp(data.user.email);cargar();
}
function mostrarApp(email){$("vistaApp").classList.remove("hidden");$("barraUsuario").classList.remove("hidden");$("usuario").textContent=email;}
async function salir(){await sb.auth.signOut();location.reload();}

async function cargar(){
  const b=$("btnActualizar");b.disabled=true;b.textContent="Leyendo Odoo y SharePoint…";
  try{
    const r=await sb.functions.invoke("medidores-facturacion",{body:{}});
    if(r.error){let m=r.error.message;try{m=(await r.error.context.json()).error||m;}catch(_){}throw new Error(m);}
    if(!r.data?.ok)throw new Error(r.data?.error||"Sin respuesta");
    DATA=r.data;
    const tipos=[...new Set(DATA.ventas.map(v=>v.tipo||"Sin tipo"))].sort();
    const sel=$("fTipo"),ant=sel.value;
    sel.innerHTML='<option value="ALL">Todos los tipos</option>'+tipos.map(t=>'<option>'+esc(t)+'</option>').join("");
    if(tipos.includes(ant))sel.value=ant;
    pintar();
  }catch(e){
    $("cuerpo").innerHTML='<tr><td colspan="11" class="cargando" style="color:var(--rojo)">No se pudo cargar: '+esc(e.message)+'</td></tr>';
  }finally{b.disabled=false;b.textContent="↻ Actualizar";}
}

function filtrar(){
  const q=$("buscar").value.trim().toLowerCase(),anio=$("fAnio").value,tipo=$("fTipo").value,cruce=$("fCruce").value;
  return DATA.ventas.filter(v=>{
    const y=String(v.fecha_cierre||"").slice(0,4);
    if(anio==="2025+"&&y&&y<"2025")return false;
    if((anio==="2025"||anio==="2026")&&y!==anio)return false;
    if(tipo!=="ALL"&&(v.tipo||"Sin tipo")!==tipo)return false;
    if(cruce==="PO"&&!/^PO/.test(v.cruce))return false;
    if(cruce==="CLI"&&!/^Cliente/.test(v.cruce))return false;
    if(cruce==="SIN"&&v.excel)return false;
    if(q&&![v.po,v.cliente,v.oportunidad,v.ordenes_venta,v.excel?.cliente,...v.facturas.map(f=>f.numero)].join(" ").toLowerCase().includes(q))return false;
    return true;
  });
}

function pintar(){
  if(!DATA)return;
  const base=filtrar();
  // Aviso principal
  const ya=base.filter(v=>v.estado==="FACTURAR_YA"),nuevos=ya.filter(v=>v.nuevo);
  const totalYa=ya.reduce((s,v)=>s+v.pendiente,0);
  $("aviso").innerHTML=ya.length
    ?'<div class="aviso rojo">🔔 <div><b>'+ya.length+' proyecto(s) con medidor instalado: facturar '+money(totalYa)+'</b>'+(nuevos.length?' · <span class="nuevo">'+nuevos.length+' NUEVO(S)</span>':'')+'<br><span style="font-size:13px">El Excel de regularización ya tiene fecha de medidor y en Odoo falta facturar el saldo.</span></div></div>'
    :'<div class="aviso ok">✅ <div><b>Sin medidores instalados pendientes de facturar</b> con los filtros actuales.</div></div>';
  document.title=(ya.length?"("+ya.length+") ":"")+"Medidores y Facturación";
  // Tarjetas
  $("kpis").innerHTML=GRUPOS.map(g=>{
    const rs=base.filter(v=>ESTADOS[v.estado]?.grupo===g.id);
    const monto=g.id==="OK"?rs.reduce((s,v)=>s+v.facturado,0):rs.reduce((s,v)=>s+Math.max(0,v.pendiente),0);
    return '<div class="kpi '+g.cls+(GRUPO===g.id?' sel':'')+'" onclick="GRUPO=\''+g.id+'\';pintar()"><div class="t">'+g.t+'</div><div class="n">'+rs.length+'</div><div class="m">'+(g.id==="SD"||g.id==="REV"?g.d:(g.id==="OK"?"Facturado ":"Pendiente ")+money(monto))+'</div></div>';
  }).join("");
  const filas=base.filter(v=>ESTADOS[v.estado]?.grupo===GRUPO)
    .sort((a,b)=>(b.nuevo-a.nuevo)||String(b.excel?.medidor||"").localeCompare(String(a.excel?.medidor||""))||String(b.fecha_cierre||"").localeCompare(String(a.fecha_cierre||"")));
  const g=GRUPOS.find(x=>x.id===GRUPO);
  $("nota").innerHTML='<b>'+esc(g.t)+'</b> · '+esc(g.d)+' · '+filas.length+' fila(s). Haz clic en una fila para ver las facturas de Odoo y el trámite del Excel.'+(GRUPO==="REV"?' Antes de facturar o corregir, confirma el caso en Odoo: puede haber facturas registradas en otra analítica.':'');
  $("cuerpo").innerHTML=filas.map(v=>{
    const e=ESTADOS[v.estado]||{txt:v.estado,cls:"b-gris"};
    const pct=Math.max(0,Math.min(100,v.pct_facturado));
    const verif=/verificar/.test(v.cruce)?'<br><span class="badge b-ama" title="La PO se tomó del Excel por coincidencia de nombre del cliente">PO por cliente · verificar</span>':'';
    const fila='<tr class="fila" onclick="toggle(\''+esc(v.clave)+'\')">'
      +'<td><b>'+esc(v.po||"—")+'</b></td>'
      +'<td style="max-width:290px"><b>'+esc(v.cliente||"—")+'</b><div class="sub">'+esc(v.oportunidad||(v.en_crm?"":"No está en el CRM (solo en el Excel)"))+'</div>'+verif+'</td>'
      +'<td>'+esc(v.tipo||"—")+'</td><td>'+fecha(v.fecha_cierre)+'</td>'
      +'<td class="num">'+money(v.contrato)+'<div class="sub">'+esc(v.fuente_contrato)+'</div></td>'
      +'<td class="num">'+money(v.facturado)+'<div class="sub">'+v.facturas.length+' doc.</div></td>'
      +'<td>'+v.pct_facturado.toLocaleString("es-EC")+'%<div class="barra"><i style="width:'+pct+'%"></i></div></td>'
      +'<td class="num"><b>'+money(v.pendiente)+'</b>'+(v.contrato?'<div class="sub">10% = '+money(v.diez_pct)+'</div>':'')+'</td>'
      +'<td>'+(v.excel?.medidor?'<b>'+fecha(v.excel.medidor)+'</b>':(v.excel?'<span class="sub">Pendiente</span>':'<span class="sub">Sin trámite</span>'))+'</td>'
      +'<td style="max-width:180px">'+esc(v.excel?.etapa||"—")+(v.excel?.proximo_responsable&&v.excel.proximo_responsable!=="—"?'<div class="sub">Próx.: '+esc(v.excel.proximo_responsable)+'</div>':'')+'</td>'
      +'<td><span class="badge '+e.cls+'">'+esc(e.txt)+'</span>'+(v.nuevo?'<span class="nuevo">NUEVO</span>':'')+(v.alerta_desde&&!v.nuevo?'<div class="sub">Alerta '+hace(v.alerta_desde)+'</div>':'')+'</td></tr>';
    return fila+(ABIERTOS.has(v.clave)?detalle(v):"");
  }).join("")||'<tr><td colspan="11" class="cargando">Nada en este grupo con los filtros actuales.</td></tr>';
  $("pie").innerHTML='Odoo y SharePoint leídos '+hace(DATA.generado)+' · Excel «'+esc(DATA.excel.archivo)+'» modificado el '+new Date(DATA.excel.modificado).toLocaleString("es-EC")+' · <a href="'+esc(DATA.excel.url)+'" target="_blank" rel="noopener">Abrir el Excel</a> · CRM sincronizado '+hace(DATA.crm_sincronizado)+' (se actualiza desde el dashboard de cierre).';
}
function detalle(v){
  const fs=v.facturas.length?'<table><thead><tr><th>Documento</th><th>Fecha</th><th class="num">Monto sin IVA</th></tr></thead><tbody>'+v.facturas.map(f=>'<tr><td>'+esc(f.numero)+'</td><td>'+fecha(f.fecha)+'</td><td class="num">'+money(f.monto)+'</td></tr>').join("")+'</tbody></table>':'<span class="sub">Odoo no tiene facturas en la analítica de esta PO ni con "PO '+esc(v.po||"")+'" en la referencia.</span>';
  const x=v.excel;
  const ex=x?'<dl><dt>Fila del Excel</dt><dd>'+x.fila+' (PO '+esc(x.po||"—")+')</dd><dt>Cliente en el Excel</dt><dd>'+esc(x.cliente)+'</dd><dt>Estado</dt><dd>'+esc(x.estado)+'</dd><dt>Etapa</dt><dd>'+esc(x.etapa)+'</dd><dt>Semáforo</dt><dd>'+esc(x.semaforo)+'</dd><dt>Días en la etapa</dt><dd>'+esc(x.dias_etapa)+'</dd><dt>Responsable EC</dt><dd>'+esc(x.responsable)+'</dd><dt>Inspección</dt><dd>'+fecha(x.inspeccion)+'</dd><dt>Medidor</dt><dd><b>'+fecha(x.medidor)+'</b></dd>'+(x.observaciones?'<dt>Observaciones</dt><dd>'+esc(x.observaciones)+'</dd>':'')+'</dl>':'<span class="sub">Esta PO no aparece en el Excel de regularización de medidores.</span>';
  return '<tr class="det"><td colspan="11"><div class="grid"><div><h4>Facturas y notas de crédito en Odoo</h4>'+fs+(v.analiticas.length?'<div class="sub" style="margin-top:6px">Analítica: '+esc(v.analiticas.join(", "))+'</div>':'')+(v.ordenes_venta?'<div class="sub">Orden de venta: '+esc(v.ordenes_venta)+'</div>':'')+'</div><div><h4>Trámite del medidor (Excel)</h4>'+ex+'<div class="sub" style="margin-top:6px">Cruce: '+esc(v.cruce)+'</div></div></div></td></tr>';
}
function toggle(k){ABIERTOS.has(k)?ABIERTOS.delete(k):ABIERTOS.add(k);pintar();}
function descargar(){
  if(!DATA)return;
  const filas=filtrar().map(v=>({"Grupo":GRUPOS.find(g=>g.id===ESTADOS[v.estado]?.grupo)?.t||"","Estado":ESTADOS[v.estado]?.txt||v.estado,"PO":v.po||"","Cliente":v.cliente||"","Oportunidad":v.oportunidad||"","Tipo":v.tipo||"","Cierre CRM":v.fecha_cierre||"","Contrato sin IVA":v.contrato,"Fuente contrato":v.fuente_contrato,"Facturado Odoo":v.facturado,"% facturado":v.pct_facturado,"Pendiente":v.pendiente,"10% del contrato":v.diez_pct,"Medidor (Excel)":v.excel?.medidor||"","Etapa trámite":v.excel?.etapa||"","Cruce":v.cruce,"Facturas":v.facturas.map(f=>f.numero).join(" | ")}));
  const ws=XLSX.utils.json_to_sheet(filas),wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,ws,"Medidores");
  XLSX.writeFile(wb,"Medidores_facturacion_"+new Date().toISOString().slice(0,10)+".xlsx");
}
// Mientras la página esté abierta, vuelve a leer cada 30 minutos.
setInterval(()=>{if(DATA&&!document.hidden)cargar();},30*60*1000);
iniciar();
</script>
</body>
</html>
